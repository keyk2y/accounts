<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F4F44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매출장">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>매출 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 구성: 휴대폰 한 칸 폭의 장부. 아래 탭 5개(입력·달력·통계·비용·설정), 위에서 아래로 한 줄씩 읽는 흐름 */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E3E9E5; --ink:#14201A; --ink-2:#55635B; --line:#D0D8D3;
  --accent:#C4421A; --accent-ink:#FFFFFF;
  --sales:#2D6A5B; --c-fixed:#4F6B87; --c-var:#9DB0C4; --c-profit:#2D6A5B;
  --bad:#B3261E; --ok:#1F7A4D; --warn:#955600;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1713; --surface:#17211C; --surface-2:#1F2B25; --ink:#E6EEE9; --ink-2:#9CABA3; --line:#2A3832;
    --accent:#FF7A4D; --accent-ink:#1A0D08;
    --sales:#5FB59F; --c-fixed:#7F9FBF; --c-var:#46607A; --c-profit:#5FB59F;
    --bad:#FF8A80; --ok:#6FD6A0; --warn:#F2B866;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#17211C; --surface-2:#1F2B25; --ink:#E6EEE9; --ink-2:#9CABA3; --line:#2A3832;
  --accent:#FF7A4D; --accent-ink:#1A0D08;
  --sales:#5FB59F; --c-fixed:#7F9FBF; --c-var:#46607A; --c-profit:#5FB59F;
  --bad:#FF8A80; --ok:#6FD6A0; --warn:#F2B866;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
h1,h2,h3,p{margin:0}

.app{max-width:560px;margin:0 auto;padding-block:12px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:4px}
.brand{min-width:0}
.store{display:block;font-size:12px;color:var(--ink-2);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;text-wrap:balance}
h2{font-size:15px;font-weight:600}
.panel{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.btn.warn{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center}

.patch{margin-top:10px;border:1px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--surface)}
.patch b{display:flex;align-items:center;gap:8px;font-size:15px}
.patch .tag{font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 6px}
.patch ul{margin:6px 0 10px;padding-left:18px;color:var(--ink-2);font-size:13px}

.daybar{display:grid;grid-template-columns:44px 1fr 44px auto;gap:8px;align-items:center;margin-top:10px}
.daylabel{text-align:center;min-width:0}
.daylabel strong{display:block;font-size:17px}
.daylabel small{color:var(--ink-2);font-size:12px}

.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{position:relative;overflow:hidden}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:14px;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:16px;line-height:1}
.ocr{margin-top:10px;font-size:14px}
.ocr .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ocr .msg{flex:1 1 180px;min-width:0}
.ocr .warn{color:var(--warn)}
.ocr .ok{color:var(--ok)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}

.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;min-height:36px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr;gap:8px}
.fld{display:grid;grid-template-columns:52px minmax(0,190px);align-items:center;gap:10px;min-width:0}
.fld>span{font-weight:600;font-size:14px}
.numbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px;padding:0 10px}
.numbox:focus-within{border-color:var(--accent)}
.numbox input{flex:1;min-width:0;border:0;background:transparent;text-align:right;font-size:18px;font-weight:600;padding:6px 0;font-variant-numeric:tabular-nums}
.numbox input:focus{outline:none}
.numbox i{font-style:normal;color:var(--ink-2);margin-left:6px}
.is-off{opacity:.45}
.check{margin-top:10px;font-size:13px;min-height:20px}
.check.ok{color:var(--ok)}
.check.warn{color:var(--warn)}
.actions{display:grid;gap:8px;margin-top:10px}
.actions.two{grid-template-columns:1fr 1fr}
.actions.two .full{grid-column:1/-1}

.minihead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mlist{margin-top:8px;display:grid}
.mrow{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;min-height:44px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:0}
.mrow:first-child{border-top:0}
.mrow small{color:var(--ink-2)}

.mnav{display:grid;grid-template-columns:44px 1fr 44px auto;gap:8px;align-items:center;margin-top:10px}
.mnav strong{text-align:center;font-size:17px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile small{display:block;color:var(--ink-2);font-size:12px}
.tile b{display:block;font-size:18px;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--ink-2);padding:2px 0}
.cell{min-height:54px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:11px}
.cell i{font-style:normal;font-size:12px;color:var(--ink-2)}
.cell b{font-size:12px;font-variant-numeric:tabular-nums}
.cell.blank{border:0;background:transparent;pointer-events:none}
.cell.has{background:var(--surface-2)}
.cell.has b{color:var(--sales)}
.cell.closed b{color:var(--ink-2);font-weight:500}
.cell.today{border-color:var(--accent)}
.cell.today i{color:var(--accent);font-weight:700}

.big{font-size:30px;font-family:var(--f-display);font-weight:400;line-height:1.2;overflow-wrap:anywhere}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pair small{display:block;color:var(--ink-2);font-size:12px}
.pair b{font-size:18px;overflow-wrap:anywhere}
.pos{color:var(--c-profit)}
.neg{color:var(--bad)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.stack i{display:block;height:100%}
.s-fixed{background:var(--c-fixed)}
.s-var{background:var(--c-var)}
.s-profit{background:var(--c-profit)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;list-style:none;margin:8px 0 0;padding:0;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--ink-2);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.em td{font-weight:700}
.sr{display:grid;grid-template-columns:1fr auto 56px;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sr span{min-width:0;overflow-wrap:anywhere}
.sr em{font-style:normal;color:var(--ink-2);font-size:12px;text-align:right}
.sr.head{font-weight:700;background:var(--surface-2);padding-inline:8px;border-radius:6px;border-bottom:0;margin-top:10px}
.sr.total{font-weight:700;border-bottom:0}
.colh{display:grid;grid-template-columns:1fr auto 56px;gap:8px;font-size:12px;color:var(--ink-2)}
.colh span:nth-child(3){text-align:right}
.hb{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;align-items:center;margin-top:10px;font-size:13px}
.hbar{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:7px}
.hb b{grid-column:2;font-size:13px}
.formula{display:grid;gap:2px;margin-top:12px}
.formula .sr{grid-template-columns:34px 1fr auto}
.formula code{font-family:var(--f-body);font-weight:700;color:var(--ink-2)}
.demo-note{margin-top:12px;border:1px dashed var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--warn);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:10px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--f-body)}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .bar{fill:var(--sales)}
svg.chart .off{fill:var(--ink-2);opacity:.5}
svg.chart .avg{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}

.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.crow{display:grid;grid-template-columns:1fr 112px 40px;gap:6px;margin-top:6px;align-items:center}
.crow input{min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px}
.crow input.ca{text-align:right;font-variant-numeric:tabular-nums}
.crow input:focus{outline:none;border-color:var(--accent)}
.crow .x{width:40px;height:44px;border:0;background:transparent;color:var(--ink-2);font-size:20px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.btn.add{border-style:dashed}
.rrow{display:grid;grid-template-columns:1fr auto 44px 44px;gap:6px;align-items:center;min-height:48px;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rrow .rn{min-width:0;overflow-wrap:anywhere}
.rrow em{font-style:normal;color:var(--ink-2);font-size:13px}
.mv{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.mv[disabled]{opacity:.35}
.mv.arm{color:var(--bad);border-color:var(--bad)}
.savebar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);padding:8px 0;margin-top:4px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;margin-top:6px}
.drow .dn{min-width:0;overflow-wrap:anywhere}
.drow input{min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;text-align:right;font-variant-numeric:tabular-nums}
.drow input:focus,.mrow2 input:focus{outline:none;border-color:var(--accent)}
.mrow2{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 44px;gap:6px;margin-top:6px;align-items:center}
.mrow2 input{min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px}
.mrow2 .mv{padding:0}
.cell.cost b{color:var(--ink-2);font-weight:500}
.set-in{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin-top:8px}
.set-in input{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;text-align:right;min-width:0}
.set-in input.left{text-align:left}
.plist{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.plist li{margin-top:2px}
.ph{margin-top:10px;font-size:13px}
.ph b{font-size:14px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;gap:2px}
.tab{border:0;background:transparent;border-radius:10px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--surface-2)}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet-p{position:relative;width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.dl{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;min-height:56px}
.dl b{display:block;font-size:15px}
.dl small{color:var(--ink-2);font-size:12px}
.sheet textarea{width:100%;height:120px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 18px;font-size:14px;font-weight:600;max-width:90%;text-align:center}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="store" id="storeName" hidden></span><h1>매출 기록장</h1></div>
    <button class="btn sm" id="btnDownload" type="button" data-act="openSheet">다운로드하기</button>
  </header>

  <div class="patch" id="patch" role="status" hidden>
    <b><span class="tag">NEW</span><span id="patchT">새로운 패치 있습니다</span></b>
    <ul id="patchL"></ul>
    <button class="btn sm primary" type="button" data-act="patchOk">확인했어요</button>
  </div>

  <main>
    <!-- 입력 -->
    <section class="panel" id="p-input">
      <div class="daybar">
        <button class="icon-btn" type="button" data-act="prevDay" aria-label="전날">‹</button>
        <div class="daylabel"><strong id="dLabel"></strong><small id="dSub"></small></div>
        <button class="icon-btn" type="button" data-act="nextDay" aria-label="다음날">›</button>
        <button class="btn sm ghost" type="button" data-act="today">오늘</button>
      </div>

      <div class="card" id="photoCard">
        <div class="card-h"><h2>영수증 사진</h2><span class="muted tiny" id="photoHint"></span></div>
        <div class="photo-actions" id="photoActions">
          <label class="btn primary pick">촬영하기<input type="file" id="fileCam" accept="image/*" capture="environment" class="vh"></label>
          <label class="btn pick">앨범에서 고르기<input type="file" id="fileAlbum" accept="image/*" multiple class="vh"></label>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="ocr" id="ocr" aria-live="polite"></div>
      </div>

      <div class="card">
        <div class="card-h"><h2>매출</h2><label class="switch" for="fClosed"><input type="checkbox" id="fClosed"> 쉬는 날</label></div>
        <div id="fields" class="fgrid">
          <label class="fld full"><span>총매출</span><div class="numbox"><input id="fTotal" inputmode="numeric" autocomplete="off" placeholder="0"><i>원</i></div></label>
          <label class="fld"><span>카드</span><div class="numbox"><input id="fCard" inputmode="numeric" autocomplete="off" placeholder="0"><i>원</i></div></label>
          <label class="fld"><span>현금</span><div class="numbox"><input id="fCash" inputmode="numeric" autocomplete="off" placeholder="0"><i>원</i></div></label>
        </div>
        <p class="check" id="fCheck" aria-live="polite"></p>
        <p class="muted tiny" id="fExisting"></p>
        <div style="margin-top:8px"><button class="btn warn sm" type="button" data-act="del" id="btnDel" hidden>이 날 기록 지우기</button></div>
      </div>

      <div id="costCards"></div>

      <div class="savebar">
        <button class="btn primary wide" type="button" data-act="save">저장</button>
        <button class="btn wide" type="button" data-act="saveNext">저장 후 다음 날</button>
      </div>

      <div class="card" id="mini"></div>
    </section>

    <section class="panel" id="p-cal" hidden></section>
    <section class="panel" id="p-stats" hidden></section>
    <section class="panel" id="p-cost" hidden></section>
    <section class="panel" id="p-set" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="화면 선택">
  <div class="tabs">
    <button class="tab" type="button" data-act="tab" data-t="input"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>입력</button>

<script>
(function(){
'use strict';

var VERSION='1.1.0';
var PATCHES=[

  {v:'1.0.4',d:'2026-11-03',n:['촬영하기, 앨범에서 고르기 버튼이 눌러도 반응 없던 문제를 고쳤어요']},
  {v:'1.0.3',d:'2026-11-03',n:['비용 탭에서 항목 순서를 ▲▼로 바꿀 수 있어요 (순서 바꾸기)','+ 항목 추가 버튼을 크게 만들었어요','알집(zip) 파일로 따로 쓸 수 있는 버전을 만들었어요']},
  {v:'1.0.2',d:'2026-11-03',n:['총매출·카드·현금 입력칸의 가로 길이를 줄였어요']},
  {v:'1.0.1',d:'2026-11-03',n:['비용 탭에서 월세 외 항목이 저장되지 않고 × 삭제가 안 되던 문제를 고쳤어요','숫자를 칠 때마다 콤마(,)가 바로 붙어요','총매출·카드·현금 입력칸을 짧게 줄였어요 (카드와 현금이 한 줄)']},
  {v:'1.0.0',d:'2026-11-03',n:['영수증 사진에서 총매출·카드·현금을 읽어 채워요','일별 기록과 달력','월 통계, 손익분기점, 세후이익','다운로드하기 (CSV, 백업 파일)']}
];

/*CALC-START*/
var DEF_SET={cardRate:2,cashRate:1,taxRate:5,store:'',
  foodItems:[{id:'f1',name:'육류'},{id:'f2',name:'식자재'},{id:'f3',name:'주류'},{id:'f4',name:'시장구매'},{id:'f5',name:'음료'},{id:'f6',name:'숯'},{id:'f7',name:'인터넷주문'},{id:'f8',name:'고기샘플'},{id:'f9',name:'기타'}],
  miscItems:[{id:'m1',name:'매장기물'},{id:'m2',name:'택배비'},{id:'m3',name:'음식물쓰레기'},{id:'m4',name:'종량제봉투'},{id:'m5',name:'요식협회비'},{id:'m6',name:'물수건'},{id:'m7',name:'석쇠'}]};
function p2(n){return n<10?'0'+n:''+n}
function dim(ym){var a=ym.split('-');return new Date(+a[0],+a[1],0).getDate()}
function sumItems(a){var t=0;(a||[]).forEach(function(i){t+=Number(i&&i.amount)||0});return t}
function mk(names){return names.map(function(n){return {name:n,amount:null}})}
function defaultCosts(){
  return {
    fixed:mk(['월세','관리비','전기세','수도','가스','마케팅','세스코','세무서 기장료','인터넷','화재보험']),
    salary:mk(['사장','한승룡','손민태','정진하','박기범','이도훈','강나연(알바1)','파견직원비용','퇴직금(10%)','4대보험료','주민세']),
    food:[],
    misc:[]
  };
}
function demoCosts(){
  var c=defaultCosts();
  c.food=mk(['육류','식자재','주류','시장구매','음료','숯','인터넷주문','고기샘플','기타']);
  c.misc=mk(['매장기물','택배비','음식물쓰레기','종량제봉투','요식협회비','물수건','석쇠']);
  var set=function(g,name,v){c[g].forEach(function(i){if(i.name===name)i.amount=v})};
  set('fixed','월세',1980000);set('fixed','관리비',220000);set('fixed','전기세',1000000);set('fixed','수도',200000);set('fixed','가스',250000);
  set('fixed','세스코',59000);set('fixed','세무서 기장료',88000);set('fixed','인터넷',30000);set('fixed','화재보험',17500);
  set('salary','사장',3000000);set('salary','손민태',1500000);set('salary','정진하',1500000);set('salary','박기범',2800000);set('salary','이도훈',1500000);set('salary','강나연(알바1)',700000);
  set('food','육류',6696620);set('food','식자재',2962900);set('food','주류',1827900);set('food','숯',646000);set('food','인터넷주문',516920);
  set('misc','물수건',105000);set('misc','석쇠',214000);
  return c;
}
function demoSales(ym){
  var a=ym.split('-'),n=dim(ym),W={0:1.15,2:0.8,3:0.85,4:1,5:1.35,6:1.4},ds=[],tw=0,last=-1;
  for(var d=1;d<=n;d++){
    var wd=new Date(+a[0],+a[1]-1,d).getDay();
    if(wd===1){ds.push({d:d,closed:true});continue}
    var w=W[wd]*(0.85+((d*37)%13)/13*0.3);
    ds.push({d:d,w:w});tw+=w;
  }
  ds.forEach(function(x,i){if(!x.closed)last=i});
  var T=41767000,C=3360000,out={},sT=0,sC=0;
  ds.forEach(function(x,i){
    var key=ym+'-'+p2(x.d);
    if(x.closed){out[key]={closed:true,total:0,card:0,cash:0};return}
    var t,c;
    if(i===last){t=T-sT;c=C-sC}else{t=Math.round(T*x.w/tw/1000)*1000;c=Math.round(C*x.w/tw/1000)*1000}
    sT+=t;sC+=c;
    out[key]={closed:false,total:t,card:t-c,cash:c};
  });
  return out;
}
function sumObj(o){var t=0;if(o)Object.keys(o).forEach(function(k){t+=Number(o[k])||0});return t}
function aggRows(defs,agg,legacy){
  var rows=[],seen={},del=0;
  (defs||[]).forEach(function(d){seen[d.id]=1;if(agg[d.id])rows.push({name:d.name||'(이름 없음)',amount:agg[d.id]})});
  Object.keys(agg).forEach(function(id){if(!seen[id])del+=agg[id]});
  if(del)rows.push({name:'삭제한 항목',amount:del});
  (legacy||[]).forEach(function(i){
    var a=Number(i&&i.amount)||0;if(!a)return;
    var hit=null;rows.forEach(function(r){if(r.name===i.name)hit=r});
    if(hit)hit.amount+=a;else rows.push({name:i.name||'(이름 없음)',amount:a});
  });
  return rows;
}
function calcMonth(ym,map,costs,st){
  var total=0,card=0,cash=0,open=0,closed=0,fAgg={},mAgg={};
  Object.keys(map).forEach(function(k){
    if(k.indexOf(ym+'-')!==0)return;
    var r=map[k];if(!r)return;
    [['food',fAgg],['misc',mAgg]].forEach(function(p){
      var src=r[p[0]];
      if(src)Object.keys(src).forEach(function(id){var v=Number(src[id])||0;if(v)p[1][id]=(p[1][id]||0)+v});
    });
    if(r.closed){closed++;return}
    var t=Number(r.total)||0;
    if(t>0){open++;total+=t;card+=Number(r.card)||0;cash+=Number(r.cash)||0}
  });
  var foodRows=aggRows(st.foodItems,fAgg,costs.food),miscRows=aggRows(st.miscItems,mAgg,costs.misc);
  var fixedItems=sumItems(costs.fixed),salary=sumItems(costs.salary),food=sumItems(foodRows),misc=sumItems(miscRows);
  var cardFee=Math.round(card*(Number(st.cardRate)||0)/100),cashFee=Math.round(cash*(Number(st.cashRate)||0)/100);
  var F=fixedItems+salary,V=food+misc+cardFee+cashFee,cost=F+V,pre=total-cost;
  var tax=Math.round(card*(Number(st.taxRate)||0)/100),post=pre-tax;
  var vr=total>0?V/total:null;
  var bep=(total>0&&vr<1)?Math.round(F/(1-vr)):null;
  return {total:total,card:card,cash:cash,open:open,closed:closed,avg:open?Math.round(total/open):0,
    fixedItems:fixedItems,salary:salary,food:food,misc:misc,foodRows:foodRows,miscRows:miscRows,cardFee:cardFee,cashFee:cashFee,
    F:F,V:V,cost:cost,pre:pre,tax:tax,post:post,vr:vr,bep:bep};
}
/*CALC-END*/

/* ---------- 공통 도우미 ---------- */
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function parseD(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)}
function ymOf(s){return s.slice(0,7)}
function addMonths(ym,n){var a=ym.split('-');var d=new Date(+a[0],+a[1]-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
function ymLabel(ym){var a=ym.split('-');return a[0]+'년 '+(+a[1])+'월'}
var WD=['일','월','화','수','목','금','토'];
function won(n){return (Math.round(Number(n))||0).toLocaleString('ko-KR')}
function wonS(n){return n<0?'−'+won(-n):won(n)}
function pct(a,b,dp){if(!b)return '–';var v=a/b*100;return (v<0?'−':'')+Math.abs(v).toFixed(dp==null?1:dp)+'%'}
function manS(n){var v=n/10000;return Math.abs(v)>=1000?Math.round(v).toLocaleString('ko-KR'):v.toFixed(1)}
function fmtMan(t){return (t%10000===0?t/10000:(t/10000).toFixed(1))+'만'}
function num(v){var s=String(v==null?'':v).replace(/[^\d]/g,'');return s===''?null:parseInt(s,10)}
function fmtIn(v){return v==null?'':won(v)}
/* 입력하는 동안 천 단위 콤마를 붙이고 커서 위치를 지켜요. 숫자(없으면 null)를 돌려줘요 */
function liveFmt(el){
  var v=el.value,pos=el.selectionStart,before=0,i;
  if(pos==null)pos=v.length;
  for(i=0;i<pos;i++)if(/\d/.test(v.charAt(i)))before++;
  var d=v.replace(/[^\d]/g,'').slice(0,12).replace(/^0+(?=\d)/,'');
  var f=d===''?'':parseInt(d,10).toLocaleString('ko-KR');
  if(f!==v){
    el.value=f;
    var np=0,seen=0;
    while(np<f.length&&seen<before){if(/\d/.test(f.charAt(np)))seen++;np++}
    try{el.setSelectionRange(np,np)}catch(e){}
  }
  return d===''?null:parseInt(d,10);
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var today=dstr(new Date());
var S={tab:'input',day:today,ym:ymOf(today),sales:{},costs:{},settings:clone(DEF_SET),demo:false,
  photos:[],ocr:{st:'idle'},ocrCtl:null,dirty:false,pending:false,dbMode:'pending',maxImg:3,imgOk:false,imp:null,delArm:false,
  dayCost:{food:{},misc:{}},manage:null,armDel:null};
var DKEY={food:'foodItems',misc:'miscItems'},DTITLE={food:'식재료',misc:'비품 및 기타경비'};
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hasSales(r){return !!(r&&!r.closed&&Number(r.total)>0)}
function dayCostSum(r,k){return sumObj(r&&r[k])}
function rowSub(r){
  if(r.closed)return '쉬는 날';
  if(hasSales(r))return '카드 '+won(r.card)+' · 현금 '+won(r.cash);
  return '매출 없음 · 비용 '+won(dayCostSum(r,'food')+dayCostSum(r,'misc'))+'원';
}

/* ---------- 저장소 (Claude 서버 db, 안 되면 이 기기) ---------- */
var LS_KEY='mg.cache.v1';
function loadCache(){var raw=lsGet(LS_KEY);if(!raw)return;try{var o=JSON.parse(raw);S.sales=o.sales||{};S.costs=o.costs||{};S.settings=Object.assign(clone(DEF_SET),o.settings||{})}catch(e){}}
function saveCache(){lsSet(LS_KEY,JSON.stringify({sales:S.sales,costs:S.costs,settings:S.settings}))}
var DB=null,dbReady=Promise.resolve(null),chains={};
function enqueue(path,fn){var prev=chains[path]||Promise.resolve();var p=prev.catch(function(){}).then(fn);chains[path]=p.catch(function(){});return p}
function dbSet(path,data){return enqueue(path,function(){return dbReady.then(function(db){if(!db)return 'local';return db.doc(path).set(data).then(function(){return 'cloud'})})})}
function dbDel(path){return enqueue(path,function(){return dbReady.then(function(db){if(!db)return 'local';return db.doc(path).delete().then(function(){return 'cloud'})})})}
function monthDays(ym){var o={},any=false;Object.keys(S.sales).forEach(function(k){if(k.indexOf(ym+'-')===0){o[k.slice(8)]=S.sales[k];any=true}});return any?o:null}
function persistSales(ym){saveCache();var days=monthDays(ym);return days?dbSet('sales/'+ym,{days:days}):dbDel('sales/'+ym)}
var timers={};
function later(key,fn,ms){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
var costDirty={};
function persistCosts(ym){
  saveCache();
  var stamp=costDirty[ym]=(costDirty[ym]||0)+1;
  later('c'+ym,function(){
    dbSet('costs/'+ym,clone(S.costs[ym])).then(function(){toast('저장했어요')}).catch(failToast).then(function(){if(costDirty[ym]===stamp)delete costDirty[ym]});
  },700);
}
var setDirty=0;
function persistSettings(){
  saveCache();
  var stamp=++setDirty;
  later('set',function(){
    dbSet('settings/main',clone(S.settings)).catch(failToast).then(function(){if(setDirty===stamp)setDirty=0});
  },600);
}
function failToast(){toast('저장하지 못했어요. 잠시 뒤에 다시 해 주세요')}

function initDb(){
  if(!(window.claude&&window.claude.use)){S.dbMode='local';return}
  dbReady=window.claude.use('db').then(function(db){return db||null}).catch(function(){return null});
  dbReady.then(function(db){
    DB=db;
    if(!db){S.dbMode='local';if(S.tab==='set')renderSet();return}
    S.dbMode='cloud';
    db.collection('sales').onSnapshot(function(snap){
      if(snap.metadata.fromCache&&snap.empty)return;
      var m={};
      snap.docs.forEach(function(d){var days=(d.data()||{}).days||{};Object.keys(days).forEach(function(k){m[d.id+'-'+k]=days[k]})});
      S.sales=m;afterData();
    },function(){});
    db.collection('costs').onSnapshot(function(snap){
      if(snap.metadata.fromCache&&snap.empty)return;
      var m={};snap.docs.forEach(function(d){m[d.id]=clone(d.data())});
      Object.keys(costDirty).forEach(function(k){if(S.costs[k])m[k]=S.costs[k]});
      S.costs=m;afterData();
    },function(){});
    db.doc('settings/main').onSnapshot(function(snap){
      if(snap.exists&&!setDirty)S.settings=Object.assign(clone(DEF_SET),clone(snap.data()));
      afterData();
    },function(){});
    if(S.tab==='set')renderSet();
  });
}
function editing(){var a=document.activeElement;return !!(a&&a.matches&&a.matches('input,textarea'))}
function afterData(){
  saveCache();
  renderBrand();
  if(S.tab==='input'){if(!S.dirty&&!editing())fillForm();else if(!editing())renderDayCosts();renderDay();renderMini();return}
  if((S.tab==='cost'||S.tab==='set')&&editing()){S.pending=true;return}
  renderTab(S.tab);
}

/* ---------- 알림 ---------- */
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2300)}

/* ---------- 패치 안내 ---------- */

    var p=PATCHES[0];
    $('patchT').textContent='새로운 패치 있습니다 · v'+p.v;
    $('patchL').innerHTML=p.n.map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
    $('patch').hidden=false;
  }

/* ---------- 머리글 ---------- */
function renderBrand(){var s=$('storeName');var n=(S.settings.store||'').trim();s.textContent=n;s.hidden=!n}

/* ---------- 입력 탭 ---------- */
function rel(d){var diff=Math.round((parseD(d)-parseD(today))/86400000);return diff===0?'오늘':diff===-1?'어제':diff===1?'내일':diff<0?(-diff)+'일 전':diff+'일 후'}
function renderDay(){
  var d=parseD(S.day);
  $('dLabel').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일';
  var r=S.sales[S.day];
  $('dSub').textContent=rel(S.day)+' · '+(r?(r.closed?'쉬는 날로 저장됨':'기록 있음'):'기록 없음');
}
function setField(id,v){$(id).value=v==null?'':won(v)}
function formVals(){return {total:num($('fTotal').value),card:num($('fCard').value),cash:num($('fCash').value)}}
function autoFill(){
  var v=formVals(),miss=['total','card','cash'].filter(function(k){return v[k]==null});
  if(miss.length!==1)return;
  var k=miss[0];
  if(k==='total')setField('fTotal',v.card+v.cash);
  else if(k==='card'&&v.total-v.cash>=0)setField('fCard',v.total-v.cash);
  else if(k==='cash'&&v.total-v.card>=0)setField('fCash',v.total-v.card);
}
function updateCheck(){

function cleanObj(o){var out={},any=false;Object.keys(o||{}).forEach(function(k){var v=Number(o[k]);if(v>0){out[k]=v;any=true}});return any?out:null}
function dcMove(k,i,d){

function dcRemove(k,i){

    return;

/* ---------- 영수증 사진 인식 ---------- */
var SAMPLE=null,sampleReady=false;
function initSample(){
  if(!(window.claude&&window.claude.use)){sampleReady=true;renderPhotoUi();return}
  window.claude.use('sample').then(function(s){
    SAMPLE=s||null;
    if(!SAMPLE)return null;
    return SAMPLE.limits().then(function(l){S.imgOk=!!(l&&l.images);S.maxImg=Math.max(1,Math.min(3,(l&&l.images&&l.images.maxCount)||1))}).catch(function(){S.imgOk=false});
  }).catch(function(){SAMPLE=null}).then(function(){sampleReady=true;renderPhotoUi()});
}
function renderPhotoUi(){
  var ok=!!(SAMPLE&&S.imgOk);
  if(!sampleReady){$('photoActions').hidden=true;$('ocr').innerHTML='<p class="muted">사진 인식을 준비하는 중이에요…</p>';return}
  $('photoActions').hidden=!ok;
  $('photoHint').textContent=ok?'합계 부분이 크게 보이게 찍어 주세요':'';
  if(!ok){$('ocr').innerHTML='<p class="muted">사진 인식을 쓸 수 없는 화면이에요. 아래 칸에 금액을 직접 넣어 주세요.</p>';$('thumbs').innerHTML='';return}
  renderOcr();
}
function clearPhotos(){
  S.photos.forEach(function(p){try{URL.revokeObjectURL(p.url)}catch(e){}});
  S.photos=[];
  if(S.ocrCtl){S.ocrCtl.abort();S.ocrCtl=null}
  S.ocr={st:'idle'};
  $('thumbs').innerHTML='';
}
function renderOcr(){
  if(!(SAMPLE&&S.imgOk))return;
  var t=$('thumbs');
  t.innerHTML=S.photos.map(function(p,i){return '<div class="thumb"><img src="'+p.url+'" alt="영수증 사진 '+(i+1)+'"><button type="button" data-act="rmPhoto" data-i="'+i+'" aria-label="사진 빼기">×</button></div>'}).join('');
  var o=S.ocr,h='';
  if(o.st==='busy')h='<div class="row"><span class="spin" aria-hidden="true"></span><span class="msg">영수증을 읽는 중이에요. 10~30초 걸려요.</span><button class="btn sm" type="button" data-act="stop">멈추기</button></div>';
  else if(o.st==='done'){
    h='<div class="row"><span class="msg '+(o.found?'ok':'warn')+'">'+esc(o.found?'읽어서 채웠어요. 숫자가 맞는지 확인하고 저장하세요.':'금액을 찾지 못했어요. 합계가 크게 보이게 다시 찍어 보세요.')+'</span><button class="btn sm" type="button" data-act="rescan">다시 읽기</button></div>';
    if(o.note)h+='<p class="muted tiny" style="margin-top:6px">'+esc(o.note)+'</p>';
    if(o.date&&o.date!==S.day){var dd=parseD(o.date);h+='<p style="margin-top:8px"><button class="chip" type="button" data-act="useDate" data-d="'+o.date+'">영수증 날짜 '+(dd.getMonth()+1)+'월 '+dd.getDate()+'일로 옮기기</button></p>'}
  }
  else if(o.st==='err')h='<div class="row"><span class="msg warn">'+esc(o.msg)+'</span>'+(S.photos.length?'<button class="btn sm" type="button" data-act="rescan">다시 읽기</button>':'')+'</div>';
  else h=S.photos.length?'':'<p class="muted">사진을 올리면 총매출, 카드, 현금을 읽어서 아래 칸에 채워요. 영수증이 길면 나눠서 최대 '+S.maxImg+'장까지 올릴 수 있어요.</p>';
  $('ocr').innerHTML=h;
}
function prepImage(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        var m=2200,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,m/Math.max(w,h));
        var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(function(b){URL.revokeObjectURL(url);res(b||file)},'image/jpeg',0.9);
      }catch(e){URL.revokeObjectURL(url);res(file)}
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}
function addPhotos(list){
  var files=[].slice.call(list||[]).filter(function(f){return /^image\//.test(f.type)||!f.type});
  if(!files.length)return;
  files.forEach(function(f){if(S.photos.length<S.maxImg)S.photos.push({file:f,url:URL.createObjectURL(f)})});
  runOcr();
}
var PROMPT=[
  '첨부한 사진은 식당 POS의 일일 마감(정산) 영수증이거나 하루 매출이 적힌 용지입니다. 사진이 여러 장이면 같은 날의 영수증 한 장을 나눠 찍은 것입니다.',
  '다음 형식의 JSON 객체 하나만 답하세요. 다른 글은 쓰지 마세요.',
  '{"date":"YYYY-MM-DD 또는 null","total":숫자 또는 null,"card":숫자 또는 null,"cash":숫자 또는 null,"note":"헷갈린 점을 한국어 한 문장으로, 없으면 빈 문자열"}',
  '규칙:',
  '- total은 그날 총매출(실제로 결제된 합계)입니다. card는 카드 결제 합계, cash는 현금 결제 합계입니다.',
  '- 총매출, 순매출, 실매출처럼 비슷한 항목이 여러 개면 카드와 현금을 더한 값과 맞는 것을 total로 고르세요.',
  '- 금액은 원 단위 정수로 쓰고 쉼표와 "원"은 빼세요.',
  '- 영수증에 없거나 읽기 어려운 값은 추측하지 말고 null로 두세요.',
  '- date는 영수증에 영업일이나 출력일이 보일 때만 4자리 연도로 쓰세요.'
].join('\n');
function money(v){var n=Number(v);return (isFinite(n)&&n>=0&&v!==null&&v!=='')?Math.round(n):null}
function runOcr(){
  if(!SAMPLE||!S.imgOk||!S.photos.length){renderOcr();return}
  if(S.ocrCtl)S.ocrCtl.abort();
  var ctl=new AbortController();S.ocrCtl=ctl;
  S.ocr={st:'busy'};renderOcr();
  Promise.all(S.photos.map(function(p){return prepImage(p.file)})).then(function(blobs){
    if(ctl.signal.aborted)throw {code:'cancelled'};
    return SAMPLE.json(PROMPT,{images:blobs,signal:ctl.signal,cache:false});
  }).then(function(res){
    if(S.ocrCtl!==ctl)return;
    S.ocrCtl=null;
    res=(res&&typeof res==='object')?res:{};
    var t=money(res.total),c=money(res.card),m=money(res.cash),found=false;
    if(t!=null){setField('fTotal',t);found=true}
    if(c!=null){setField('fCard',c);found=true}
    if(m!=null){setField('fCash',m);found=true}
    if(found){$('fClosed').checked=false;applyClosedUi();autoFill();S.dirty=true}
    updateCheck();
    S.ocr={st:'done',found:found,note:typeof res.note==='string'?res.note.slice(0,120):'',date:/^\d{4}-\d{2}-\d{2}$/.test(res.date||'')?res.date:''};
    renderOcr();
  }).catch(function(e){
    if(S.ocrCtl!==ctl)return;
    S.ocrCtl=null;
    var code=e&&e.code,msg='사진을 읽지 못했어요. 금액을 직접 넣거나 다시 눌러 주세요.';
    if(code==='cancelled'){S.ocr={st:'idle'};renderOcr();return}
    if(code==='not_granted'||code==='sampling_disabled'||code==='capability_disabled'||code==='not_declared')msg='Claude 사용이 허용되지 않아 사진 인식을 쓸 수 없어요. 금액은 직접 넣어 주세요.';
    else if(code==='rate_limited')msg='요청이 많아요. 잠시 뒤에 다시 눌러 주세요.';
    else if(code==='image_rejected')msg='이 사진은 읽을 수 없어요. 다른 사진을 골라 주세요.';
    else if(code==='invalid_json'||code==='empty_completion'||code==='refused')msg='영수증에서 금액을 찾지 못했어요. 합계가 크게 보이게 다시 찍어 주세요.';
    S.ocr={st:'err',msg:msg};renderOcr();
  });
}

function inheritCosts(ym){
  var keys=Object.keys(S.costs).filter(function(k){return k<ym}).sort();
  if(!keys.length)return defaultCosts();
  var base=S.costs[keys[keys.length-1]],out={};
  ['fixed','salary'].forEach(function(g){out[g]=clone(base[g]||[])});
  out.food=[];out.misc=[];
  return out;
}
function costsFor(ym){return S.costs[ym]||inheritCosts(ym)}
function ensureCosts(ym){if(!S.costs[ym])S.costs[ym]=inheritCosts(ym);return S.costs[ym]}

function srow(name,amt,den,cls){return '<div class="sr '+(cls||'')+'"><span>'+esc(name)+'</span><b class="n">'+wonS(amt)+'</b><em class="n">'+pct(amt,den)+'</em></div>'}
function grpBlock(title,items,sub,den){
  var rows=(items||[]).filter(function(i){return Number(i.amount)}).map(function(i){return srow(i.name||'(이름 없음)',Number(i.amount),den)}).join('');

}
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function barChart(ym,map,avg){
  var n=dim(ym),W=340,H=150,L=38,R=6,T=10,B=22,pw=W-L-R,ph=H-T-B,max=0,vals=[];
  for(var d=1;d<=n;d++){var r=map[ym+'-'+p2(d)],v=(r&&!r.closed)?(Number(r.total)||0):0;vals.push({d:d,v:v,off:!!(r&&r.closed)});if(v>max)max=v}
  if(!max)return '';
  var nm=niceMax(Math.max(max,avg)),y=function(v){return T+ph*(1-v/nm)},slot=pw/n,bw=slot*0.68,s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="일별 총매출 막대 그래프">';
  [0,nm/2,nm].forEach(function(t){s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'"/><text x="'+(L-4)+'" y="'+(y(t)+3).toFixed(1)+'" text-anchor="end">'+(t===0?'0':fmtMan(t))+'</text>'});
  vals.forEach(function(o,i){
    var x=L+i*slot+(slot-bw)/2;
    if(o.off)s+='<rect class="off" x="'+x.toFixed(1)+'" y="'+(T+ph-2)+'" width="'+bw.toFixed(1)+'" height="2" rx="1"/>';
    else if(o.v>0)s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y(o.v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(T+ph-y(o.v)).toFixed(1)+'" rx="1.5"/>';
    if(o.d===1||o.d%5===0||o.d===n)s+='<text x="'+(L+i*slot+slot/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+o.d+'</text>';
  });
  if(avg>0)s+='<line class="avg" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(avg).toFixed(1)+'" y2="'+y(avg).toFixed(1)+'"/>';
  return s+'</svg>';
}

  c.foodRows.forEach(function(i){add('식재료 · '+i.name,i.amount)});
  c.miscRows.forEach(function(i){add('비품 및 기타경비 · '+i.name,i.amount)});
  add('현금수수료',c.cashFee);add('카드수수료',c.cardFee);
  add('고정비용 합계',c.F);add('변동비용 합계',c.V);add('총비용',c.cost);add('세전이익',c.pre);add('세금',c.tax);add('세후이익',c.post);
  rows.push(['손익분기점 매출액',c.bep==null?'':c.bep,'']);
  return csv(rows);
}
function allCsv(){
  var rows=[DAY_HEAD];
  Object.keys(S.sales).sort().forEach(function(k){rows.push(dayRow(k,S.sales[k]))});
  return csv(rows);
}
function backupJson(){return JSON.stringify({app:'매출 기록장',version:1,exportedAt:new Date().toISOString(),settings:S.settings,sales:S.sales,costs:S.costs},null,1)}
function offer(name,text){
  var fb=$('dlFallback');fb.hidden=true;
  var show=function(){$('dlText').value=text;fb.hidden=false};
  if(!(window.claude&&window.claude.use)){
    try{
      var b=new Blob([text],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('저장했어요');
    }catch(e){show()}
    return;
  }
  window.claude.use('downloads').then(function(dl){
    if(!dl){show();return}
    return dl.save({filename:name,data:text}).then(function(){toast('저장했어요')}).catch(function(e){if(e&&e.code==='declined')return;show()});
  }).catch(show);
}
function copyText(){
  var t=$('dlText');
  var done=function(){toast('복사했어요')};
  var sel=function(){t.focus();t.select();toast('내용을 선택했어요. 길게 눌러 복사해 주세요')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,sel);else sel();
}

/* ---------- 백업 불러오기 ---------- */
function readImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(String(fr.result));
      if(!o||typeof o!=='object'||(!o.sales&&!o.costs))throw 0;
      S.imp={name:file.name,data:o,days:Object.keys(o.sales||{}).length,months:Object.keys(o.costs||{}).length,hasSettings:!!o.settings};
    }catch(e){S.imp=null;toast('백업 파일이 아니에요. 다운로드하기로 받은 JSON을 골라 주세요')}
    renderSet();
  };
  fr.readAsText(file);
}
function applyImport(){
  var o=S.imp.data,months={};
  Object.keys(o.sales||{}).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){S.sales[k]=o.sales[k];months[ymOf(k)]=1}});
  Object.keys(o.costs||{}).forEach(function(k){if(/^\d{4}-\d{2}$/.test(k))S.costs[k]=o.costs[k]});
  if(o.settings)S.settings=Object.assign(clone(DEF_SET),clone(o.settings));
  saveCache();
  var jobs=Object.keys(months).map(function(ym){return persistSales(ym)});
  Object.keys(o.costs||{}).forEach(function(k){if(/^\d{4}-\d{2}$/.test(k))jobs.push(dbSet('costs/'+k,S.costs[k]))});
  if(o.settings)jobs.push(dbSet('settings/main',clone(S.settings)));
  Promise.all(jobs).then(function(){toast('불러왔어요')}).catch(failToast);
  S.imp=null;renderBrand();renderSet();
}

/* ---------- 클릭 처리 ---------- */
var ACT={
  tab:function(el){setTab(el.dataset.t)},
  prevDay:function(){changeDay(addDays(S.day,-1))},
  nextDay:function(){changeDay(addDays(S.day,1))},
  today:function(){changeDay(today)},
  pick:function(el){changeDay(el.dataset.d);setTab('input')},
  cam:function(){$('fileCam').click()},
  album:function(){$('fileAlbum').click()},
  rmPhoto:function(el){var p=S.photos.splice(+el.dataset.i,1)[0];if(p)try{URL.revokeObjectURL(p.url)}catch(e){}
    if(S.photos.length)runOcr();else{if(S.ocrCtl){S.ocrCtl.abort();S.ocrCtl=null}S.ocr={st:'idle'};renderOcr()}},
  rescan:function(){runOcr()},
  stop:function(){if(S.ocrCtl)S.ocrCtl.abort()},
  useDate:function(el){changeDay(el.dataset.d,true);toast('날짜를 옮겼어요')},
  dcAdd:function(el){dcAdd(el.dataset.k)},
  dcManage:function(el){S.manage=el.dataset.k;S.armDel=null;renderDayCosts()},
  dcDone:function(){
    ['food','misc'].forEach(function(k){
      var a=dayItems(k),keep=a.filter(function(it){return (it.name||'').trim()});
      if(keep.length!==a.length){S.settings[DKEY[k]]=keep;persistSettings()}
    });
    S.manage=null;S.armDel=null;renderDayCosts();
  },
  dcUp:function(el){dcMove(el.dataset.k,+el.dataset.i,-1)},
  dcDown:function(el){dcMove(el.dataset.k,+el.dataset.i,1)},
  dcDel:function(el){dcRemove(el.dataset.k,+el.dataset.i)},
  save:function(){save(false)},
  saveNext:function(){save(true)},
  del:function(){delDay()},
  mprev:function(){S.reorder=null;S.ym=addMonths(S.ym,-1);renderTab(S.tab)},
  mnext:function(){S.reorder=null;S.ym=addMonths(S.ym,1);renderTab(S.tab)},
  mnow:function(){S.reorder=null;S.ym=ymOf(today);renderTab(S.tab)},
  reorderOn:function(el){S.reorder=el.dataset.g;renderCost()},
  reorderOff:function(){S.reorder=null;renderCost()},
  mvUp:function(el){moveItem(el.dataset.g,+el.dataset.i,-1)},
  mvDown:function(el){moveItem(el.dataset.g,+el.dataset.i,1)},
  demoOn:function(){S.demo=true;renderStats()},
  demoOff:function(){S.demo=false;renderStats()},
  addItem:function(el){var c=ensureCosts(S.ym);c[el.dataset.g].push({name:'',amount:null});persistCosts(S.ym);renderCost();
    var rows=document.querySelectorAll('[data-g="'+el.dataset.g+'"] .crow .cn');if(rows.length)rows[rows.length-1].focus()},
  rmItem:function(el){var c=ensureCosts(S.ym);c[el.dataset.g].splice(+el.dataset.i,1);persistCosts(S.ym);renderCost()},
  openSheet:function(){$('dlMonthT').textContent=ymLabel(S.ym)+' 통계 (CSV)';$('dlFallback').hidden=true;$('sheet').hidden=false},
  closeSheet:function(){$('sheet').hidden=true},
  dlMonth:function(){offer('매출기록_'+S.ym+'.csv',monthCsv(S.ym))},
  dlAll:function(){offer('매출기록_전체.csv',allCsv())},
  dlBackup:function(){offer('매출기록_백업_'+today+'.json',backupJson())},
  dlCopy:copyText,
  importPick:function(){var f=$('fileImp');if(f){f.onchange=function(){if(f.files[0])readImport(f.files[0])};f.click()}},
  importGo:applyImport,
  importCancel:function(){S.imp=null;renderSet()},
  patchOk:function(){lsSet('mg.seen',VERSION);$('patch').hidden=true}
};
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');
  if(!el)return;
  var f=ACT[el.dataset.act];
  if(f)f(el,e);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').hidden)$('sheet').hidden=true});

/* 입력칸 */
['fTotal','fCard','fCash'].forEach(function(id){
  var el=$(id);
  el.addEventListener('input',function(){liveFmt(el);S.dirty=true;updateCheck()});
  el.addEventListener('blur',function(){autoFill();updateCheck()});
});
$('fClosed').addEventListener('change',function(){S.dirty=true;applyClosedUi();updateCheck()});
$('fileCam').addEventListener('change',function(e){addPhotos(e.target.files);e.target.value=''});
$('fileAlbum').addEventListener('change',function(e){addPhotos(e.target.files);e.target.value=''});

/* 날마다 식재료·비품 입력칸 */
$('costCards').addEventListener('input',function(e){
  var t=e.target;if(!t.classList)return;
  if(t.classList.contains('dc')){
    var k=t.dataset.dk,o=S.dayCost[k]||(S.dayCost[k]={}),v=liveFmt(t);
    if(v)o[t.dataset.id]=v;else delete o[t.dataset.id];
    S.dirty=true;
    var s=document.querySelector('[data-dsub="'+k+'"]');if(s)s.textContent=won(sumObj(o))+'원';
  }else if(t.classList.contains('mn')){
    var it=dayItems(t.dataset.mk)[+t.dataset.i];
    if(it){it.name=t.value;persistSettings()}
  }
});

/* 비용 입력칸 */
$('p-cost').addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.g||!t.dataset.f)return;
  var c=ensureCosts(S.ym),it=(c[t.dataset.g]||[])[+t.dataset.i];if(!it)return;
  if(t.dataset.f==='name')it.name=t.value;
  else{it.amount=liveFmt(t)}
  updateSubs();persistCosts(S.ym);
});
$('p-cost').addEventListener('focusout',function(e){var t=e.target;if(t.dataset&&t.dataset.f==='amount')t.value=fmtIn(num(t.value))});

/* 설정 입력칸 */
$('p-set').addEventListener('change',function(e){
  var t=e.target,v;
  if(t.id==='sStore'){S.settings.store=t.value.trim();renderBrand()}
  else if(t.id==='sCard'||t.id==='sCash'||t.id==='sTax'){
    v=parseFloat(String(t.value).replace(',','.'));if(!isFinite(v)||v<0)v=0;if(v>100)v=100;
    S.settings[t.id==='sCard'?'cardRate':t.id==='sCash'?'cashRate':'taxRate']=v;t.value=v;
  }else return;
  persistSettings();toast('저장했어요');
});
document.addEventListener('focusout',function(){setTimeout(function(){if(S.pending&&!editing()){S.pending=false;renderTab(S.tab)}},50)});

/* ---------- 시작 ---------- */
loadCache();
renderBrand();
fillForm();
renderPhotoUi();
setTab('input');
initPatch();
initDb();
initSample();
})();
</script>
